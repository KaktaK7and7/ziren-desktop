[package]
name = "ziren-desktop"
version = "1.0.0-rc.1"
description = "Ziren Assistant desktop client"
authors = ["Ziren"]
edition = "2021"

[lib]
name = "ziren_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
