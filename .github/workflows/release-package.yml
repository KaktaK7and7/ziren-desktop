name: Release Desktop Package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/stage_core_sidecar.ps1"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/release-package.yml"

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CORE_REPOSITORY: KaktaK7and7/ziren-assistant-v2
  CORE_REF: release/ziren-core-packaging-2026-08-31

jobs:
  package-windows:
    name: Build unsigned Windows RC installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Desktop
        uses: actions/checkout@v4
        with:
          path: desktop

      - name: Checkout pinned Core packaging branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPOSITORY }}
          ref: ${{ env.CORE_REF }}
          path: core

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            core/requirements.txt
            core/requirements-release.txt

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Build frozen Core
        shell: pwsh
        working-directory: core
        run: |
          python -m pip install -r requirements-release.txt
          ./scripts/build_release_core.ps1

      - name: Stage verified Core sidecar
        shell: pwsh
        working-directory: desktop
        run: |
          ./scripts/stage_core_sidecar.ps1 `
            -CoreExe "../core/build/release-core/dist/assistant-core.exe" `
            -CoreMetadata "../core/build/release-core/dist/assistant-core.metadata.json"

      - name: Install Desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Generate candidate Cargo lockfile
        working-directory: desktop
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Check Rust formatting
        working-directory: desktop
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Build frontend
        working-directory: desktop
        run: npm run build

      - name: Audit runtime dependencies
        working-directory: desktop
        run: npm audit --omit=dev --audit-level=high

      - name: Build NSIS release candidate
        working-directory: desktop
        run: npm run tauri -- build --bundles nsis

      - name: Verify bundled sidecar and installer
        shell: pwsh
        working-directory: desktop
        run: |
          $source = "src-tauri/binaries/assistant-core-x86_64-pc-windows-msvc.exe"
          $bundled = "src-tauri/target/release/assistant-core.exe"
          if (-not (Test-Path $source)) { throw "Staged sidecar is missing" }
          if (-not (Test-Path $bundled)) { throw "Tauri did not copy the Core sidecar" }
          $sourceHash = (Get-FileHash -Algorithm SHA256 $source).Hash.ToLowerInvariant()
          $bundledHash = (Get-FileHash -Algorithm SHA256 $bundled).Hash.ToLowerInvariant()
          if ($sourceHash -ne $bundledHash) {
            throw "Bundled sidecar hash differs from staged Core"
          }
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File)
          if ($installers.Count -lt 1) { throw "NSIS installer was not produced" }
          Write-Host "Core SHA256: $sourceHash"
          $installers | ForEach-Object { Write-Host "Installer: $($_.FullName) ($($_.Length) bytes)" }

      - name: Upload generated Cargo lockfile
        uses: actions/upload-artifact@v4
        with:
          name: ziren-desktop-cargo-lock
          path: desktop/src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ziren-assistant-windows-x64-unsigned-rc
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
