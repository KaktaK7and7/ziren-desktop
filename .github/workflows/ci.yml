name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - cyberpunk-ui

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Report dev-tool vulnerabilities
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high
          audit_code=$?
          set -e
          if [ "$audit_code" -ne 0 ]; then
            echo "::warning::High-severity issue exists only in the development/build dependency tree. Runtime dependencies passed the blocking audit."
          fi
          exit 0

  rust:
    name: Rust format and check
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Stage compile-only sidecar stub
        shell: pwsh
        run: |
          $targetTriple = (rustc --print host-tuple).Trim()
          if (-not $targetTriple) { throw "Could not resolve Rust host target triple" }
          $dir = "src-tauri/binaries"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $destination = Join-Path $dir ("assistant-core-" + $targetTriple + ".exe")
          Copy-Item -Force "$env:WINDIR/System32/where.exe" $destination
          Write-Host "Compile-only sidecar stub: $destination"

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
